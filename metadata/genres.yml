templates:
  Genre:
    plex_search:
      genre: <<genre>>
    file_poster: <<poster>>
    sort_title: "!03_01_<<collection_name>>"
    collection_order: alpha
    sync_mode: sync
    run_again: false
  Special Genre:
    file_poster: <<poster>>
    sort_title: "!00_00_<<collection_name>>"
    collection_order: release
    run_again: false

collections:
  ###########################
  #    Genre Collections    #
  ###########################
  Action:
    template:
      {
        name: Genre,
        genre: Action,
        poster: config/assets/posters/genres/action.png,
      }
    summary: A genre of film in which the protagonist is thrust into a series of events that typically involve violence, extended fighting, physical feats, and frantic chases. Action films are usually categorized by a resourceful hero struggling against incredible odds, which include life-threatening situations, an evil villain, or a pursuit which usually concludes in victory for the hero.
  Adventure:
    template:
      {
        name: Genre,
        genre: Adventure,
        poster: config/assets/posters/genres/adventure.png,
      }
    summary: A genre of film that typically features a protagonist who embarks on a journey or quest, often in an exotic or fantastical setting, facing various challenges and obstacles along the way. Adventure films often include elements of action, exploration, and discovery, and may involve themes of heroism, bravery, and the pursuit of a goal or treasure.
  Animation:
    template:
      {
        name: Genre,
        genre: Animation,
        poster: config/assets/posters/genres/animation.png,
      }
    summary: A genre of film that uses animation techniques to create the illusion of movement, often featuring colorful and imaginative visuals. Animated films can be targeted towards children or adults and can encompass a wide range of sub-genres, including comedy, fantasy, science fiction, and more. They often rely on storytelling, character development, and visual creativity to engage audiences.
  Anime:
    template:
      {
        name: Genre,
        genre: Anime,
        poster: config/assets/posters/genres/anime.png,
      }
    summary: A genre of film that originates from Japan and is characterized by its distinct animation style, often featuring colorful artwork, fantastical themes, and vibrant characters. Anime can encompass a wide range of genres and themes, including action, adventure, romance, science fiction, fantasy, and more. It is known for its unique storytelling techniques and has gained a global following for its diverse and imaginative content.
  Biography:
    template:
      {
        name: Genre,
        genre: Biography,
        poster: config/assets/posters/genres/biography.png,
      }
    summary: A genre of film that tells the story of a real person's life, often focusing on their achievements, struggles, and significant events. Biographical films, or biopics, aim to provide insight into the subject's character and experiences, often portraying their impact on society or history. These films can cover a wide range of subjects, including historical figures, celebrities, political leaders, and more.
  Comedy:
    template:
      {
        name: Genre,
        genre: Comedy,
        poster: config/assets/posters/genres/comedy.png,
      }
    summary: A genre of film that is designed to entertain and amuse audiences through humor. Comedy films often feature exaggerated characters, situations, and dialogue to create laughter and provide a lighthearted escape from reality. Sub-genres of comedy include romantic comedy, slapstick, satire, dark comedy, and more, each offering a different style of humor to cater to various tastes.
  Crime:
    template:
      {
        name: Genre,
        genre: Crime,
        poster: config/assets/posters/genres/crime.png,
      }
    summary: A genre of film that focuses on criminal activities, often involving a protagonist who is either a criminal or a law enforcement officer. Crime films typically explore themes of morality, justice, and the consequences of illegal actions. They can include elements of suspense, mystery, and action, and may be set in various time periods and locations, ranging from gritty urban environments to glamorous settings.
  Documentary:
    template:
      {
        name: Genre,
        genre: Documentary,
        poster: config/assets/posters/genres/documentary.png,
      }
    summary: A genre of film that presents factual information about real-life events, people, or issues. Documentaries aim to educate, inform, or raise awareness about a particular subject, often using interviews, archival footage, and narration to tell a compelling story. They can cover a wide range of topics, including history, science, social issues, nature, and more, and may be presented in various styles, such as observational, participatory, or expository.
  Drama:
    template:
      {
        name: Genre,
        genre: Drama,
        poster: config/assets/posters/genres/drama.png,
      }
    summary: A genre of film that focuses on realistic storytelling, character development, and emotional themes. Drama films often explore complex relationships, moral dilemmas, and social issues, aiming to evoke empathy and provoke thought in the audience. They can encompass a wide range of sub-genres, including romantic drama, historical drama, crime drama, and more, each offering a different perspective on human experiences and emotions.
  Family:
    template:
      {
        name: Genre,
        genre: Family,
        poster: config/assets/posters/genres/family.png,
      }
    summary: A genre of film that is suitable for viewers of all ages, often featuring themes of togetherness, love, and moral lessons. Family films typically include content that is appropriate for children while also appealing to adults, making them enjoyable for the entire family. They can encompass a wide range of sub-genres, including animated films, adventure stories, comedies, and more, often emphasizing positive values and heartwarming narratives.
  Fantasy:
    template:
      {
        name: Genre,
        genre: Fantasy,
        poster: config/assets/posters/genres/fantasy.png,
      }
    summary: A genre of film that features magical, supernatural, or otherworldly elements that are not found in the real world. Fantasy films often take place in imaginary worlds or alternate realities and may include mythical creatures, magical powers, and epic quests. They can explore themes of heroism, good versus evil, and the power of imagination, offering audiences an escape into fantastical adventures and imaginative storytelling.
  Gangster:
    template:
      { name: Special Genre, poster: config/assets/posters/genres/gangster.png }
    sort_title: "!03_01_Gangster"
    imdb_list:
      - https://www.imdb.com/list/ls026270180/
      - https://www.imdb.com/list/ls000093502/
      - https://www.imdb.com/list/ls001818278/
    imdb_search:
      type: movie
      keyword: gangster
      release.after: 1930-01-01
      release.before: 2020-01-01
      genre: crime, drama
      limit: 2000
    summary: A genre of film that focuses on the lives and activities of criminals, often centered around organized crime and the underworld. Gangster films typically explore themes of power, loyalty, betrayal, and the consequences of a life of crime. They may feature antiheroes or morally ambiguous characters who navigate the dangerous world of crime, often leading to violent confrontations and dramatic storylines.
  History:
    template:
      {
        name: Genre,
        genre: History,
        poster: config/assets/posters/genres/history.png,
      }
    summary: A genre of film that depicts historical events, figures, or periods, often with a focus on accuracy and authenticity. Historical films aim to provide insight into the past, exploring significant moments in history and the people who shaped them. They can cover a wide range of topics, including wars, political movements, cultural shifts, and more, often blending factual storytelling with dramatic elements to engage audiences.
  Horror:
    template:
      {
        name: Genre,
        genre: Horror,
        poster: config/assets/posters/genres/horror.png,
      }
    summary: A genre of film that is designed to evoke fear, suspense, and terror in the audience. Horror films often feature supernatural elements, monsters, or psychological themes that create a sense of dread and unease. They can explore various sub-genres, including slasher films, supernatural horror, psychological horror, and more, each offering a different approach to scaring and thrilling viewers.
  Martial Arts:
    template:
      {
        name: Special Genre,
        poster: config/assets/posters/genres/martial_arts.png,
      }
    sort_title: "!03_01_Martial_Arts"
    imdb_list:
      - https://www.imdb.com/list/ls000099643/
      - https://www.imdb.com/list/ls068611186/
      - https://www.imdb.com/list/ls068378513/
      - https://www.imdb.com/list/ls090404120/
      - https://www.imdb.com/list/ls062949711/
    imdb_search:
      type: movie
      keyword: martial-arts
      release.after: 1970-01-01
      genre: action
      limit: 2000
    summary: A genre of film that focuses on martial arts combat and techniques, often featuring skilled fighters, intense action sequences, and themes of honor, discipline, and self-improvement. Martial arts films can encompass a wide range of styles and settings, from traditional kung fu movies to modern action films, and may include elements of fantasy or historical drama. They often showcase impressive choreography and physical feats, making them popular among fans of action and combat cinema.
  Musical:
    template:
      {
        name: Genre,
        genre: Musical,
        poster: config/assets/posters/genres/musical.png,
      }
    summary: A genre of film that combines music, singing, and dancing with storytelling to create a unique cinematic experience. Musical films often feature characters who express their emotions and advance the plot through song and dance numbers. They can encompass a wide range of sub-genres, including romantic musicals, comedy musicals, and more, each offering a different style of music and storytelling. Musicals are known for their vibrant visuals, catchy songs, and energetic performances that captivate audiences.
  Mystery:
    template:
      {
        name: Genre,
        genre: Mystery,
        poster: config/assets/posters/genres/mystery.png,
      }
    summary: A genre of film that revolves around the solving of a puzzle, crime, or unexplained event, often featuring a protagonist who is a detective, investigator, or amateur sleuth. Mystery films typically involve suspenseful storytelling, red herrings, and plot twists that keep audiences guessing until the resolution. They can encompass a wide range of sub-genres, including detective stories, psychological thrillers, and more, each offering a different approach to unraveling the mystery at hand.
  Pandemic:
    template:
      { name: Special Genre, poster: config/assets/posters/genres/pandemic.png }
    sort_title: "!03_01_Pandemic"
    imdb_list:
      - https://www.imdb.com/list/ls092321048/
      - https://www.imdb.com/list/ls567402655/
      - https://www.imdb.com/list/ls523400700/
    imdb_search:
      type: movie
      keyword: pandemic
      release.after: 1980-01-01
      genre: action, thriller, sci-fi
      limit: 2000
    summary: A genre of film that focuses on the outbreak and spread of infectious diseases, often depicting the impact of a pandemic on society and individuals. Pandemic films typically explore themes of survival, fear, and the human response to crisis, often featuring characters who must navigate the challenges of a rapidly spreading disease. They can include elements of horror, science fiction, and drama, offering a gripping portrayal of the consequences of a global health crisis.
  Romance:
    template:
      {
        name: Genre,
        genre: Romance,
        poster: config/assets/posters/genres/romance.png,
      }
    summary: A genre of film that focuses on romantic relationships between characters, often exploring themes of love, passion, and emotional connection. Romance films typically feature a central love story that drives the plot, with characters facing obstacles and challenges that test their relationship. They can encompass a wide range of sub-genres, including romantic comedies, romantic dramas, and more, each offering a different perspective on the complexities of love and relationships.
  Science Fiction:
    template:
      {
        name: Genre,
        genre: Science Fiction,
        poster: config/assets/posters/genres/science_fiction.png,
      }
    summary: A genre of film that explores imaginative and futuristic concepts, often involving advanced technology, space exploration, time travel, parallel universes, and extraterrestrial life. Science fiction films can encompass a wide range of sub-genres, including cyberpunk, space opera, dystopian fiction, and more, each offering a different vision of the future and the impact of scientific advancements on society. They often explore themes of humanity, ethics, and the consequences of technological progress.
  Short:
    template:
      {
        name: Genre,
        genre: Short,
        poster: config/assets/posters/genres/short.png,
      }
    summary: A genre of film that is characterized by its shorter runtime, typically under 40 minutes, and often focuses on a single idea, theme, or story. Short films can encompass a wide range of genres and styles, including animation, documentary, experimental, and narrative fiction. They are often used as a platform for emerging filmmakers to showcase their talent and creativity, and can be a powerful medium for storytelling in a concise format.
  Sports:
    template:
      {
        name: Genre,
        genre: Sport,
        poster: config/assets/posters/genres/sports.png,
      }
    summary: A genre of film that centers around sports and athletic competition, often featuring stories of perseverance, teamwork, and triumph. Sports films can encompass a wide range of sub-genres, including biographical sports dramas, underdog stories, and more, each offering a different perspective on the world of sports. They often explore themes of dedication, sacrifice, and the pursuit of excellence, making them inspiring and engaging for audiences.
  Stand Up Comedy:
    template:
      {
        name: Special Genre,
        poster: config/assets/posters/genres/stand_up_comedy.png,
      }
    sort_title: +03_01_Stand_Up_Comedy
    imdb_list:
      - https://www.imdb.com/list/ls070221411/
      - https://www.imdb.com/list/ls086584751/
      - https://www.imdb.com/list/ls086022668/
      - https://www.imdb.com/list/ls049792208/
    imdb_search:
      type: movie
      keyword: stand-up-comedy
      release.after: 2000-01-01
      genre: comedy
      limit: 2000
    summary: A genre of film that features stand-up comedians performing their routines in front of a live audience, often recorded for distribution as a comedy special. Stand-up comedy films typically showcase the comedian's unique style and material, covering a wide range of topics and humor styles. They can include observational comedy, satire, dark humor, and more, offering audiences a chance to experience the energy and spontaneity of a live comedy performance from the comfort of their own home.
  Sword & Sorcery:
    template:
      {
        name: Special Genre,
        poster: config/assets/posters/genres/sword_and_sorcery.png,
      }
    sort_title: "!03_01_Sword_&_Sorcery"
    imdb_list:
      - https://www.imdb.com/list/ls022909805/
      - https://www.imdb.com/list/ls033395053/
    imdb_search:
      type: movie
      keyword: sword-and-sorcery
      release.after: 1980-01-01
      genre: action, fantasy
      limit: 2000
    summary: A subgenre of fantasy that typically features heroic characters, often warriors or adventurers, who engage in battles against supernatural forces, such as sorcerers, monsters, and mythical creatures. Sword & Sorcery films often take place in a fantastical world filled with magic, ancient civilizations, and epic quests. They emphasize action, adventure, and the struggle between good and evil, often featuring themes of heroism, bravery, and the triumph of the human spirit against overwhelming odds.
  Thriller:
    template:
      {
        name: Genre,
        genre: Thriller,
        poster: config/assets/posters/genres/thriller.png,
      }
    summary: A genre of film that is designed to create suspense, excitement, and tension in the audience. Thriller films often feature a protagonist who is in danger or facing a high-stakes situation, with the plot revolving around the pursuit of a goal or the resolution of a conflict. They can encompass a wide range of sub-genres, including psychological thrillers, crime thrillers, and more, each offering a different approach to keeping audiences on the edge of their seats.
  War:
    template:
      { name: Genre, genre: War, poster: config/assets/posters/genres/war.png }
    summary: A genre of film that focuses on the depiction of warfare, often exploring the experiences of soldiers, civilians, and the impact of war on society. War films can encompass a wide range of sub-genres, including historical war dramas, anti-war films, and more, each offering a different perspective on the realities of conflict. They often explore themes of heroism, sacrifice, and the moral complexities of war, providing audiences with a powerful and thought-provoking portrayal of one of humanity's most significant challenges.
  Western:
    template:
      {
        name: Genre,
        genre: Western,
        poster: config/assets/posters/genres/western.png,
      }
    summary: A genre of film that is set in the American Old West, typically during the late 19th century, and often features themes of frontier life, lawlessness, and the struggle for survival. Western films often include iconic elements such as cowboys, outlaws, sheriffs, and Native Americans, with storylines that revolve around conflicts over land, justice, and personal honor. They can encompass a wide range of sub-genres, including classic Westerns, revisionist Westerns, and more, each offering a different perspective on the mythology and reality of the American West.
  LGBTQ+:
    template:
      { name: Special Genre, poster: config/assets/posters/genres/lgbtq.png }
    sort_title: "!03_01_LGBTQ+"
    trakt_list: https://trakt.tv/users/basinator/lists/lgbtq-movies
    summary: A genre of film that focuses on LGBTQ+ themes, characters, and stories, often exploring the experiences, challenges, and triumphs of individuals within the LGBTQ+ community. LGBTQ+ films can encompass a wide range of sub-genres, including romantic dramas, comedies, documentaries, and more, each offering a different perspective on the diverse experiences of LGBTQ+ individuals. They often explore themes of identity, love, acceptance, and social issues, providing representation and visibility for the LGBTQ+ community in cinema.
  Superhero:
    template:
      {
        name: Special Genre,
        poster: config/assets/posters/genres/superhero.png,
      }
    sort_title: "!03_01_Superhero"
    imdb_search:
      type: movie
      keyword: superhero
      release.after: 2000-01-01
      genre: action
      limit: 2000
    summary: A genre of film that features characters with superhuman powers or abilities, often centered around their heroic missions and battles against powerful adversaries. Superhero films typically explore themes of heroism, responsibility, redemption, and the struggle between good and evil. They can encompass a wide range of storylines, from origin stories to ensemble adventures, featuring iconic heroes from comic books and expanding universes with interconnected narratives and spectacular action sequences.
  Film Noir:
    template:
      {
        name: Special Genre,
        poster: config/assets/posters/genres/film_noir.jpg,
      }
    sort_title: "!03_01_Film Noir"
    imdb_search:
      type: movie
      release.after: 1930-01-01
      genre: film-noir
      limit: 2000
    summary: A genre of film characterized by dark, moody atmospheres, cynical characters, and morally complex narratives, often set in urban environments and featuring crime, corruption, and betrayal. Film noir typically employs low-key lighting, dramatic shadows, and a pessimistic worldview to create a sense of danger and intrigue. These films often feature troubled protagonists, femme fatales, and themes of fate, justice, and the darker aspects of human nature, establishing a distinct visual and narrative style that has influenced cinema for decades.
  Heist:
    template:
      { name: Special Genre, poster: config/assets/posters/genres/heist.jpg }
    sort_title: "!03_01_Heist"
    imdb_search:
      type: movie
      keyword: heist
      release.after: 1980-01-01
      genre: action, thriller
      limit: 2000
    summary: A genre of film that revolves around the planning and execution of a major theft or robbery, often featuring a team of skilled criminals assembling to pull off an elaborate scheme. Heist films typically emphasize careful planning, clever strategies, and unexpected twists, exploring themes of teamwork, ambition, and the risks of criminal enterprise. These films combine elements of suspense, action, and drama, keeping audiences engaged through the intricacies of the plot and the tension of whether the heist will succeed or fail.
  Spy:
    template:
      { name: Special Genre, poster: config/assets/posters/genres/spy.jpg }
    sort_title: "!03_01_Spy"
    imdb_search:
      type: movie
      keyword: spy
      release.after: 1980-01-01
      genre: action, thriller
      limit: 2000
    summary: A genre of film that focuses on espionage, surveillance, and intelligence operations, often featuring spies, secret agents, and covert missions. Espionage films typically explore themes of loyalty, betrayal, deception, and the moral complexities of intelligence work. They can range from realistic portrayals of spycraft to theatrical adventures featuring gadgets and exotic locations, with protagonists navigating dangerous situations, double-crosses, and high-stakes international conflicts.
  Post-Apocalyptic:
    template:
      {
        name: Special Genre,
        poster: config/assets/posters/genres/post_apocalyptic.png,
      }
    sort_title: "!03_01_Post-Apocalyptic"
    imdb_list: https://www.imdb.com/list/ls063157256/
    summary: A genre of film set in a world after a cataclysmic event has devastated civilization, leaving survivors to navigate a harsh and dangerous landscape. Post-apocalyptic films explore themes of survival, human resilience, moral ambiguity, and the rebuilding of society in the face of extinction-level threats. They can feature elements of action, science fiction, and thriller genres, depicting worlds ravaged by war, disease, natural disasters, or technological collapse, where protagonists must adapt to new realities and confront both environmental and human threats.
  Disaster:
    template:
      { name: Special Genre, poster: config/assets/posters/genres/disaster.png }
    sort_title: "!03_01_Disaster"
    imdb_search:
      type: movie
      keyword: disaster
      release.after: 1970-01-01
      genre: action, drama
      limit: 2000
    summary: A genre of film that depicts large-scale catastrophic events or natural disasters and their impact on individuals and society. Disaster films typically feature intense action sequences, spectacular visual effects, and high-stakes survival scenarios as characters navigate environmental threats such as earthquakes, tsunamis, volcanic eruptions, storms, or asteroid impacts. These films explore themes of human courage, sacrifice, and the triumph of survival instincts, often combining elements of action, drama, and suspense to showcase both the awesome destructive power of nature and the resilience of humanity.
  Romantic Comedy:
    template:
      {
        name: Special Genre,
        poster: config/assets/posters/genres/romantic_comedy.jpg,
      }
    sort_title: "!03_01_Romantic Comedy"
    plex_search:
      all:
        genre: [Comedy, Romance]
    summary: A genre of film that combines elements of romantic love stories with comedic humor and lighthearted entertainment. Romantic comedy films, often known as "rom-coms," typically revolve around the development of a romantic relationship between characters, featuring witty dialogue, humorous situations, and emotional moments that balance comedy with genuine affection. They often explore themes of love, attraction, compatibility, and the amusing complications of relationships, offering audiences an entertaining escape that celebrates the joys and challenges of finding and maintaining romantic connections.
