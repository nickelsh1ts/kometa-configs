collections:
  #####################################
  #         Trakt Collections         #
  #####################################
  Box Office Top 10:
    sync_mode: sync
    sort_title: "!01_05_Box Office"
    trakt_boxoffice: true
    summary: Top 10 grossing movies in the U.S. box office last weekend currently available on NickflixTV. Updated every Monday morning.
    file_poster: config/assets/posters/suggestions/boxoffice.png
    smart_label: release.desc
    collection_mode: show_items
    radarr_add_missing: true
    radarr_search: true
    radarr_monitor: true
    radarr_tag: ko-boxoffice
    run_again: true
    visible_home: true
    visible_shared: true
  Trending on Trakt:
    trakt_chart:
      chart: trending
      limit: 100
    tmdb_trending_daily: 50
    tmdb_trending_weekly: 50
    sort_title: "!02_00_Trending"
    sync_mode: sync
    item_label: "Trending"
    collection_order: release
    summary: "Collection of Movies trending on Trakt in the last 7 days"
    radarr_add_missing: false
    radarr_search: false
    radarr_monitor: false
    file_poster: config/assets/posters/suggestions/trakttrending.png
  Most Watched This Week:
    trakt_chart:
      chart: watched
      limit: 10
      time_period: weekly
    sort_title: "!02_05_Watched This Week"
    sync_mode: sync
    summary: "Collection of Movies most watched this week on Trakt"
    radarr_add_missing: false
    file_poster: config/assets/posters/suggestions/mostwatchedweek.png
    collection_order: custom
    collection_mode: show_items
  Most Watched This Year:
    trakt_chart:
      chart: watched
      limit: 250
      time_period: yearly
    sort_title: "!02_10_Watched This Year"
    sync_mode: sync
    summary: "Collection of Movies most watched this year on Trakt"
    radarr_add_missing: false
    file_poster: config/assets/posters/suggestions/mostwatchedyear.png
    collection_order: custom
    collection_mode: show_items
  Top Ten Pirated Weekly:
    trakt_list: https://trakt.tv/users/hdlists/lists/top-ten-pirated-movies-of-the-week-torrent-freak-com
    smart_label: year.desc
    sync_mode: sync
    sort_title: "!02_15_Pirated Weekly"
    summary: "Collection of the top 10 pirated movies of the week"
    radarr_add_missing: true
    radarr_search: true
    radarr_monitor: true
    radarr_tag: ko-pirated
    file_poster: config/assets/posters/suggestions/toppirated.png
