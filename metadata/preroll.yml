collections:
  #####################################
  #        Scheduled PreRolls         #
  #####################################
  christmas:
    build_collection: false
    server_preroll:
      - - "/mnt/hdd1/pre-roll/NickflixTV.mp4"
        - "/mnt/hdd1/pre-roll/Merry Christmas.mkv"
      - - "/mnt/hdd1/pre-roll/NickflixTV.mp4"
        - "/mnt/hdd1/pre-roll/Merry Xmas.mkv"
    schedule: range(12/01-12/31)
  winter:
    build_collection: false
    server_preroll:
      - - "/mnt/hdd1/pre-roll/NickflixTV.mp4"
        - "/mnt/hdd1/pre-roll/Happy Holidays.mkv"
    schedule: range(01/01-03/31)
  spring:
    build_collection: false
    server_preroll:
      - - "/mnt/hdd1/pre-roll/NickflixTV.mp4"
        - "/mnt/hdd1/pre-roll/Spring Flowers.mkv"
      - - "/mnt/hdd1/pre-roll/NickflixTV.mp4"
        - "/mnt/hdd1/pre-roll/Spring Time.mkv"
    schedule: range(04/01-05/31)
  base:
    build_collection: false
    server_preroll:
      - - "/mnt/hdd1/pre-roll/NickflixTV.mp4"
        - "/mnt/hdd1/pre-roll/Plex.mkv"
      - - "/mnt/hdd1/pre-roll/NickflixTV.mp4"
        - "/mnt/hdd1/pre-roll/Marvel.mkv"
      - - "/mnt/hdd1/pre-roll/NickflixTV.mp4"
        - "/mnt/hdd1/pre-roll/Disney.mkv"
      - - "/mnt/hdd1/pre-roll/NickflixTV.mp4"
        - "/mnt/hdd1/pre-roll/PlexHub.mkv"
      - - "/mnt/hdd1/pre-roll/NickflixTV.mp4"
        - "/mnt/hdd1/pre-roll/Enjoy The Show (retro).mkv"
    schedule: "range(06/01-09/30) + range(11/01-11/30)"
  halloween:
    build_collection: false
    server_preroll:
      - - "/mnt/hdd1/pre-roll/NickflixTV.mp4"
        - "/mnt/hdd1/pre-roll/Happy Halloween.mkv"
      - - "/mnt/hdd1/pre-roll/NickflixTV.mp4"
        - "/mnt/hdd1/pre-roll/Happy Halloween (v2).mkv"
    schedule: range(10/01-10/31)
