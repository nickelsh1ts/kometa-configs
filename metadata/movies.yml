templates:
  tmdb:
    optional:
      - collections
      - lists
      - movies
      - tmdb_summary
      - summary
    tmdb_collection: <<collections>>
    tmdb_list: <<lists>>
    tmdb_movie: <<movies>>
    tmdb_summary: <<tmdb_summary>>
    summary: <<summary>>
    file_poster: <<poster>>
    sync_mode: sync
    sort_title: "!05_05_<<collection_name>>"
    collection_order: release
    collection_mode: show_items
    run_again: false

collections:
  ######################################################
  #                Movie Collections                   #
  ######################################################
