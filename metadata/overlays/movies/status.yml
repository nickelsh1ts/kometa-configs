overlays:
  InTheatersIMDb:
    overlay:
      name: In Theaters
      file: config/assets/overlays/status/in_theatres_small.png
      group: STATUS
      weight: 1000
    imdb_chart: box_office
  InTheatersTMDb:
    overlay:
      name: In Theaters
      file: config/assets/overlays/status/in_theatres_small.png
      group: STATUS
      weight: 1000
    tmdb_now_playing: 30
    collection_order: custom
    sync_mode: sync
  InTheatersFormat:
    overlay:
      name: In Theaters
      file: config/assets/overlays/status/in_theatres_small.png
      group: STATUS
      weight: 1000
    plex_all: true
    filters:
      filepath.regex: (?i)\b((?:HD|HQ)?CAM|(?:HD)?TS|TELESYNC)\b
