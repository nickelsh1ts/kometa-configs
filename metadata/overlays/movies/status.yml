overlays:
  InTheatersIMDb:
    overlay:
      name: In Theaters
      file: config/assets/overlays/status/in_theatres_small.png
      group: STATUS
      weight: 1000
    imdb_chart: box_office
  InTheatersTMDb:
    overlay:
      name: In Theaters
      file: config/assets/overlays/status/in_theatres_small.png
      group: STATUS
      weight: 1000
    tmdb_discover:
      limit: 300
      sort_by: release_date.desc
      with_release_type: 2|3
      release_date.gte: 01/01/2025
      release_date.lte: 12/31/2026
  InTheatersFormat:
    overlay:
      name: In Theaters
      file: config/assets/overlays/status/in_theatres_small.png
      group: STATUS
      weight: 1000
    plex_all: true
    filters:
      filepath.regex: (?i)\b((?:HD|HQ)?CAM|(?:HD)?TS|TELESYNC)\b
