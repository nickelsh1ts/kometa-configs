# yaml-language-server: $schema=https://raw.githubusercontent.com/Kometa-Team/Kometa/nightly/json-schema/overlay-schema.json
overlays:
  # RecentlyAdded:
  #   overlay:
  #     name: Recently Added
  #     file: config/assets/overlays/status/recently_added.png
  #     group: STATUS
  #     weight: 950
  #   plex_all: true
  #   filters:
  #     added: 7

  NewSeason:
    overlay:
      name: NewSeason
      file: config/assets/overlays/status/new_season.png
      group: STATUS
      weight: 900
    plex_all: true
    filters:
      added.not: 30
      seasons:
        percentage: 1
        added: 21
        title.not: Specials
      tmdb_status:
        - returning
        - planned
        - production

  NewSeasonTVDB:
    overlay:
      name: NewSeason
      file: config/assets/overlays/status/new_season.png
      group: STATUS
      weight: 900
    plex_search:
      all:
        added.not: 30
        episode_added: 21
    filters:
      seasons:
        percentage: 1
        added: 21
        title.not: Specials
      tmdb_status: canceled
      tvdb_status: Continuing

  Airing:
    overlay:
      name: airing
      file: config/assets/overlays/status/airing_small.png
      group: STATUS
      weight: 850
    tmdb_on_the_air: 2000

  AiringTVDB:
    overlay:
      name: airing
      file: config/assets/overlays/status/airing_small.png
      group: STATUS
      weight: 850
    plex_search:
      all:
        episode_air_date: 14
    filters:
      tmdb_status: canceled
      tvdb_status: Continuing

  Returning:
    overlay:
      name: returning
      file: config/assets/overlays/status/returning_small.png
      group: STATUS
      weight: 800
    plex_all: true
    filters:
      tmdb_status:
        - returning
        - planned
        - production

  ReturningTVDB:
    overlay:
      name: returning
      file: config/assets/overlays/status/returning_small.png
      group: STATUS
      weight: 800
    plex_all: true
    filters:
      tmdb_status: canceled
      tvdb_status: Continuing

  Ended:
    overlay:
      name: ended
      file: config/assets/overlays/status/ended_small.png
      group: STATUS
      weight: 700
    plex_all: true
    filters:
      tmdb_status: ended

  Cancelled:
    overlay:
      name: cancelled
      file: config/assets/overlays/status/cancelled_small.png
      group: STATUS
      weight: 600
    plex_all: true
    filters:
      tmdb_status: canceled
