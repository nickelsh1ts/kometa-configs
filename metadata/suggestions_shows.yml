# yaml-language-server: $schema=https://raw.githubusercontent.com/Kometa-Team/Kometa/nightly/json-schema/collection-schema.json
templates:
  suggestion:
    file_poster: <<poster>>
    sort_title: "!01_15_<<collection_name>>"
    collection_mode: show_items
    sync_mode: sync

collections:
  ################
  ##    Plex    ##
  ################
  Recently Aired:
    template: { name: suggestion, poster: config/assets/posters/suggestions/recentlyaired.png }
    smart_filter:
      all:
        episode_air_date: 7
      sort_by: episode_added.desc
    summary: Episodes that have aired within the last week.
  New Episodes:
    template: { name: suggestion, poster: config/assets/posters/suggestions/newepisodes.png }
    smart_filter:
      all:
        episode_added: 7
      sort_by: episode_added.desc
    summary: Episodes that have been added within the last week.
  Recently Added:
    template: { name: suggestion, poster: config/assets/posters/suggestions/recentlyadded.png }
    smart_filter:
      all:
        added: 7
      sort_by: added.desc
    summary: Shows that have been added within the last week.
  #################
  ##    Trakt   ##
  #################
  Trending on Trakt:
    mdblist_list: https://mdblist.com/lists/snoak/trakt-s-trending-shows
    file_poster: config/assets/posters/suggestions/trakttrending.png
    summary: "Collection of TV Shows trending on Trakt in the last 30 days"
    sort_title: "!01_10_Trending on Trakt"
    sync_mode: sync
